[project]
name = "gopro-nas-sync"
version = "0.1.0"
description = "Raspberry Pi daemon that wakes GoPro cameras over BLE and streams new media to a NAS over Ethernet"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Philipp Buluschek" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "open-gopro>=0.22,<0.23",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2",
    "tomli-w>=1",
]

[project.urls]
Homepage = "https://github.com/kitschen/gopro-nas-sync"
Issues = "https://github.com/kitschen/gopro-nas-sync/issues"

[project.scripts]
gopro-sync = "gopro_sync.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gopro_sync"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
